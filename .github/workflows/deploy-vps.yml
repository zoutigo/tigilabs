name: Deploy (VPS)

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create deployment archive
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=apps/web/.next \
            --exclude=apps/api/dist \
            --exclude=docker/docker-compose.dev.yml \
            -czf /tmp/tigilabs-release.tar.gz .
          mv /tmp/tigilabs-release.tar.gz ./tigilabs-release.tar.gz

      - name: Upload archive to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "tigilabs-release.tar.gz"
          target: "~/apps"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail

            echo "==> Prepare deploy directory"
            APPS_ROOT=~/apps
            APP_DIR="${APPS_ROOT}/tigilabs"
            STAGING_DIR="${APPS_ROOT}/tigilabs-next"
            PREVIOUS_APP_DIR="${APPS_ROOT}/tigilabs-prev-$(date +%s)"
            ARCHIVE_PATH="${APPS_ROOT}/tigilabs-release.tar.gz"
            ENV_BACKUP=/tmp/tigilabs.env.backup
            mkdir -p "${APP_DIR}/docker"
            if [ -f "${APP_DIR}/docker/.env" ]; then
              cp "${APP_DIR}/docker/.env" "${ENV_BACKUP}"
            fi

            echo "==> Replace application code from CI archive"
            rm -rf "${STAGING_DIR}"
            mkdir -p "${STAGING_DIR}"
            tar -xzf "${ARCHIVE_PATH}" -C "${STAGING_DIR}"
            rm -f "${ARCHIVE_PATH}"
            if [ -f "${ENV_BACKUP}" ]; then
              mkdir -p "${STAGING_DIR}/docker"
              mv "${ENV_BACKUP}" "${STAGING_DIR}/docker/.env"
            fi

            if [ -d "${APP_DIR}" ]; then
              mv "${APP_DIR}" "${PREVIOUS_APP_DIR}"
            fi
            mv "${STAGING_DIR}" "${APP_DIR}"

            echo "==> Ensure shared docker networks"
            NGINX_NETWORK=proxy
            docker network ls | grep -w db >/dev/null 2>&1 || docker network create db
            docker network ls | grep -w "${NGINX_NETWORK}" >/dev/null 2>&1 || docker network create "${NGINX_NETWORK}"

            cd "${APP_DIR}"

            echo "==> Rebuild & restart containers"
            NGINX_NETWORK="${NGINX_NETWORK}" docker compose -f docker/docker-compose.vps.yml --env-file docker/.env up -d --build

            echo "==> Run Prisma migrations in API container"
            NGINX_NETWORK="${NGINX_NETWORK}" docker compose -f docker/docker-compose.vps.yml --env-file docker/.env exec -T api sh -lc "pnpm prisma:migrate:deploy"

            echo "==> Reload shared nginx (containers were recreated, IPs changed)"
            docker exec nginx-proxy nginx -t
            docker exec nginx-proxy nginx -s reload

            if [ -d "${PREVIOUS_APP_DIR}" ]; then
              echo "==> Cleanup previous release"
              docker run --rm -v "${APPS_ROOT}:/workspace" alpine:3.20 sh -lc "rm -rf /workspace/$(basename "${PREVIOUS_APP_DIR}")"
            fi

            echo "==> Status"
            NGINX_NETWORK="${NGINX_NETWORK}" docker compose -f docker/docker-compose.vps.yml --env-file docker/.env ps
